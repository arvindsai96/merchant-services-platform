<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Merchant Account - PayFlowPro Registration</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.svg">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-light-surface d-flex align-items-center justify-content-center min-vh-100 py-5 position-relative">

  <!-- Top Right Utility Controls (RTL & Theme Toggle) -->
  <div class="auth-top-controls">
    <button class="header-util-btn rtl-toggle-btn shadow-sm" title="Toggle RTL/LTR" type="button">RTL</button>
    <button class="header-util-btn theme-toggle-btn shadow-sm" title="Toggle Light/Dark" type="button">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div class="custom-card p-4 p-md-5 shadow-lg bg-white">
          <!-- PayFlowPro Brand Logo & Title (Inside container) -->
          <div class="text-center mb-4">
            <a class="navbar-brand-logo justify-content-center mb-2 d-inline-flex" href="index.html">
              <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
              <span>PayFlow<span class="text-primary">Pro</span></span>
            </a>
            <p class="text-muted small mb-0">Open a Fast Underwriting Merchant Account</p>
          </div>

          <form id="registerForm" class="needs-validation demo-auth-form" novalidate>
            <div id="regAlert" class="alert d-none mb-3"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold small">Legal Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" placeholder="e.g. Marcus Vance" value="" required>
                <div class="invalid-feedback">Please enter your legal full name.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small">Business Email <span class="text-danger">*</span></label>
                <input type="email" id="regEmailInput" class="form-control" placeholder="e.g. marcus@northstarretail.com" value="" required>
                <div class="invalid-feedback">Invalid email</div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small">Legal Business Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" placeholder="e.g. Northstar Retail LLC" value="" required>
                <div class="invalid-feedback">Please enter your legal business name.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small">Estimated Monthly Card Volume</label>
                <select class="form-select">
                  <option value="under25k">$0 – $25,000 / month</option>
                  <option value="25k-100k" selected>$25,000 – $100,000 / month</option>
                  <option value="100k-500k">$100,000 – $500,000 / month</option>
                  <option value="500k-plus">$500,000+ / month (Enterprise VIP)</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold small">Create Account Password <span class="text-danger">*</span></label>
                <div class="input-group has-validation">
                  <input type="password" id="regPassword" class="form-control border-end-0" placeholder="e.g. Pass123! (min. 8 characters)" value="" minlength="8" required>
                  <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="regPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye-fill"></i>
                  </button>
                  <div class="invalid-feedback">Password must be at least 8 characters.</div>
                </div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="termsCheck" required>
                  <label class="form-check-label small" for="termsCheck">
                    I agree to the <a href="terms.html" target="_blank" class="text-primary fw-semibold text-decoration-underline">Merchant Terms of Service</a> and acknowledge next-day underwriting verification.
                  </label>
                  <div class="invalid-feedback">You must agree to the Terms of Service.</div>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-lg w-100">Complete Registration & Enter Portal <i class="bi bi-arrow-right"></i></button>
              </div>
            </div>
            <div class="text-center text-muted small mt-4 mb-0">
              Already registered? <a href="login.html" class="fw-bold">Sign In Here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>
</body>
</html>
