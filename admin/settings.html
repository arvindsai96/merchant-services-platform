<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings & API Keys - PayFlowPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"><div class="admin-sidebar-header"><a class="navbar-brand-logo text-white" href="../index.html"><div class="brand-icon"><i class="bi bi-shield-check"></i></div><span class="ms-2">PayFlow<span class="text-primary">Pro</span></span></a></div><ul class="admin-nav"><li class="admin-nav-item"><a class="admin-nav-link" href="index.html"><i class="bi bi-grid-fill"></i> <span>Dashboard</span></a></li><li class="admin-nav-item"><a class="admin-nav-link" href="transactions.html"><i class="bi bi-receipt-cutoff"></i> <span>Transactions</span></a></li><li class="admin-nav-item"><a class="admin-nav-link active" href="settings.html"><i class="bi bi-gear-fill"></i> <span>Settings</span></a></li></ul></aside>
    <main class="admin-main">
      <header class="admin-topbar"><h5 class="mb-0 fw-bold">Account Settings & Developer API Keys</h5><button class="btn btn-sm btn-light theme-toggle-btn"><i class="bi bi-moon-stars-fill"></i></button></header>
      <div class="admin-content">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="custom-card p-4">
              <h5>Merchant Profile</h5>
              <form class="mt-3" onsubmit="event.preventDefault(); this.reset(); const a=document.getElementById('adminProfileAlert'); const b=document.getElementById('saveAdminProfileBtn'); if(b){ b.innerHTML='<i class=\'bi bi-check-circle-fill me-1\'></i> Saved! Ready for Next Entry'; b.disabled=true; } if(a){ a.classList.remove('d-none'); setTimeout(()=>{ a.classList.add('d-none'); if(b){ b.innerHTML='Save Profile'; b.disabled=false; } }, 3000); }">
                <div id="adminProfileAlert" class="alert alert-success d-none py-2 px-3 small mb-3 align-items-center gap-2"><i class="bi bi-check-circle-fill me-1"></i> Profile saved successfully! Form cleared and ready for next entry.</div>
                <div class="mb-3"><label class="form-label small fw-bold">Business Legal Name</label><input type="text" class="form-control" placeholder="e.g. Northstar Retail LLC" value=""></div>
                <div class="mb-3"><label class="form-label small fw-bold">Primary Notification Email</label><input type="email" class="form-control" placeholder="e.g. marcus@northstarretail.com" value=""></div>
                <button type="submit" id="saveAdminProfileBtn" class="btn btn-primary">Save Profile</button>
              </form>
            </div>
          </div>
            <div class="col-lg-6">
            <div class="custom-card p-4">
              <h5>API Credentials & Webhooks</h5>
              
              <!-- Publishable Key -->
              <div class="mb-3 mt-3">
                <label class="form-label small fw-bold" for="pubKeyInput">Live Publishable Key</label>
                <div class="input-group">
                  <input type="text" id="pubKeyInput" class="form-control font-monospace" value="pk_live_948291048201" readonly>
                  <button class="btn btn-outline-secondary" type="button" onclick="copyApiKey('pubKeyInput', this)" title="Copy Publishable Key">
                    <i class="bi bi-clipboard"></i>
                  </button>
                </div>
              </div>

              <!-- Secret Key -->
              <div class="mb-3">
                <label class="form-label small fw-bold" for="secretKeyInput">Live Secret Key</label>
                <div class="input-group">
                  <input type="password" id="secretKeyInput" class="form-control font-monospace" value="sk_live_9948201948201" readonly>
                  <button class="btn btn-outline-secondary" type="button" onclick="toggleSecretVisibility('secretKeyInput', this)" title="Toggle Secret Visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" onclick="copyApiKey('secretKeyInput', this)" title="Copy Secret Key">
                    <i class="bi bi-clipboard"></i>
                  </button>
                </div>
                <div id="copyAlert" class="form-text text-success d-none mt-1">
                  <i class="bi bi-check2-circle me-1"></i> Copied to clipboard!
                </div>
              </div>

              <div class="d-flex align-items-center gap-2 mt-4">
                <button class="btn btn-outline-primary" type="button" onclick="rollSecretKey()"><i class="bi bi-arrow-repeat me-1"></i> Roll Secret Key</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script>
    function copyApiKey(inputId, btnElement) {
      const input = document.getElementById(inputId);
      if (!input) return;
      
      // Copy to clipboard
      navigator.clipboard.writeText(input.value).then(() => {
        showCopyFeedback(btnElement);
      }).catch(() => {
        // Fallback for older browsers / iframe contexts
        input.select();
        document.execCommand('copy');
        showCopyFeedback(btnElement);
      });
    }

    function showCopyFeedback(btnElement) {
      if (!btnElement) return;
      const originalHTML = btnElement.innerHTML;
      btnElement.innerHTML = '<i class="bi bi-check2 text-success"></i>';
      btnElement.classList.add('btn-outline-success');
      btnElement.classList.remove('btn-outline-secondary');
      
      const copyAlert = document.getElementById('copyAlert');
      if (copyAlert) {
        copyAlert.classList.remove('d-none');
        setTimeout(() => copyAlert.classList.add('d-none'), 2500);
      }

      setTimeout(() => {
        btnElement.innerHTML = originalHTML;
        btnElement.classList.remove('btn-outline-success');
        btnElement.classList.add('btn-outline-secondary');
      }, 2000);
    }

    function toggleSecretVisibility(inputId, btnElement) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const icon = btnElement.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye-override', 'bi-eye');
          icon.classList.remove('bi-eye-slash');
        }
      }
    }

    function rollSecretKey() {
      const randomSuffix = Math.random().toString(36).substring(2, 12) + Math.random().toString(36).substring(2, 6);
      const newSecret = 'sk_live_' + randomSuffix;
      const secretInput = document.getElementById('secretKeyInput');
      if (secretInput) {
        secretInput.value = newSecret;
      }
      navigator.clipboard.writeText(newSecret).catch(() => {});
      const copyAlert = document.getElementById('copyAlert');
      if (copyAlert) {
        copyAlert.innerHTML = '<i class="bi bi-check2-circle me-1"></i> New secret key generated and copied!';
        copyAlert.classList.remove('d-none');
        setTimeout(() => {
          copyAlert.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Copied to clipboard!';
          copyAlert.classList.add('d-none');
        }, 3000);
      }
    }
  </script>
</body>
</html>
