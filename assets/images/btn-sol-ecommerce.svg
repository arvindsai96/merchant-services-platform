<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e29"/>
      <stop offset="50%" stop-color="#180e3a"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowEcom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Rich Background -->
  <rect width="400" height="120" fill="url(#bgGradEcom)"/>

  <!-- High-Tech Global Constellation Grid across entire width -->
  <g stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2">
    <line x1="0" y1="20" x2="400" y2="20" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke-dasharray="4,6"/>
    <line x1="130" y1="0" x2="130" y2="120" stroke-dasharray="4,6"/>
    <line x1="210" y1="0" x2="210" y2="120" stroke-dasharray="4,6"/>
    <line x1="290" y1="0" x2="290" y2="120" stroke-dasharray="4,6"/>
    <line x1="370" y1="0" x2="370" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Dynamic Circuit Beams across entire button -->
  <path d="M0 35 L70 35 L100 65 L220 65 L245 40 L340 40 L360 60 L400 60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glowEcom)"/>
  <path d="M0 90 L110 90 L140 65 L200 65 L230 95 L400 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#glowEcom)"/>

  <!-- Currency Pills in center-left -->
  <g transform="translate(140, 26)">
    <circle cx="16" cy="18" r="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#glowEcom)"/>
    <text x="16" y="22" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">$</text>
    <circle cx="36" cy="38" r="10" fill="#312e81" stroke="#00f2fe" stroke-width="1.5" filter="url(#glowEcom)"/>
    <text x="36" y="42" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">€</text>
  </g>

  <!-- Primary Glowing 1-Click Global Checkout Modal on Right -->
  <g transform="translate(268, 12)">
    <!-- Cyan Halo Glow -->
    <rect x="-6" y="-4" width="122" height="84" rx="14" fill="#00d2ff" opacity="0.22" filter="url(#glowEcom)"/>
    <!-- Checkout Modal Body -->
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#glowEcom)"/>
    <!-- Modal Header -->
    <rect x="0" y="0" width="112" height="16" rx="10" fill="#1e1b4b"/>
    <circle cx="10" cy="8" r="2.5" fill="#f43f5e"/>
    <circle cx="18" cy="8" r="2.5" fill="#eab308"/>
    <circle cx="26" cy="8" r="2.5" fill="#10b981"/>
    <!-- Holographic Globe & Pay Pill Inside -->
    <g transform="translate(18, 24)">
      <!-- Globe -->
      <circle cx="18" cy="22" r="16" fill="none" stroke="#6366f1" stroke-width="1.5"/>
      <ellipse cx="18" cy="22" rx="16" ry="7" fill="none" stroke="#818cf8" stroke-width="1"/>
      <ellipse cx="18" cy="22" rx="7" ry="16" fill="none" stroke="#818cf8" stroke-width="1"/>
      <!-- 1-Click Pay Pill -->
      <rect x="38" y="14" width="38" height="16" rx="8" fill="#4f46e5" stroke="#ffffff" stroke-width="1"/>
      <text x="57" y="25" fill="#ffffff" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">1-CLICK</text>
    </g>
    <!-- Arrow indicator -->
    <path d="M88 40 L100 40 M95 35 L100 40 L95 45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="45" cy="80" r="3" fill="#00f2fe" filter="url(#glowEcom)"/>
  <circle cx="105" cy="30" r="2.5" fill="#818cf8" opacity="0.8"/>
  <circle cx="215" cy="85" r="3" fill="#00f2fe" filter="url(#glowEcom)"/>
  <circle cx="390" cy="35" r="3" fill="#c084fc" filter="url(#glowEcom)"/>
</svg>
