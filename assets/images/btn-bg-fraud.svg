<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradFraud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021424"/>
      <stop offset="50%" stop-color="#072a4c"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowFraud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradFraud)"/>

  <!-- Radar Sweep & Concentric Security Rings across canvas -->
  <g transform="translate(200, 60)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="3,5"/>
    <line x1="-190" y1="0" x2="190" y2="0" stroke="rgba(56, 189, 248, 0.25)"/>
  </g>

  <!-- Left: Encrypted Lock Badge -->
  <g transform="translate(195, 34)" opacity="0.45">
    <rect x="0" y="14" width="38" height="30" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M10 14 L10 7 C10 2 28 2 28 7 L28 14" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="19" cy="26" r="3" fill="#f0f9ff"/>
    <line x1="19" y1="29" x2="19" y2="35" stroke="#f0f9ff" stroke-width="1.8"/>
  </g>

  <!-- Right: Prominent 3DS Shield & Biometric Verification Crest -->
  <g transform="translate(295, 14)">
    <!-- 3D Security Shield -->
    <path d="M36 4 L72 15 C72 49 54 72 36 83 C18 72 0 49 0 15 Z" 
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2.2" filter="url(#glowFraud)" opacity="0.95"/>
    
    <!-- Shield Inset -->
    <path d="M36 13 L61 22 C61 45 47 63 36 72 C25 63 11 45 11 22 Z" 
          fill="#082f49" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    
    <!-- Shield Core Checkmark -->
    <path d="M23 43 L32 52 L49 34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFraud)"/>

    <!-- 3D Secure 2.3 Floating Tag -->
    <g transform="translate(50, 20)">
      <rect x="0" y="0" width="42" height="17" rx="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1" filter="url(#glowFraud)"/>
      <text x="4" y="12" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">3DS 2.3</text>
    </g>
  </g>

  <!-- Risk Telemetry Signal Dots -->
  <circle cx="35" cy="40" r="3" fill="#38bdf8" filter="url(#glowFraud)"/>
  <circle cx="90" cy="85" r="2.5" fill="#10b981" filter="url(#glowFraud)"/>
  <circle cx="185" cy="25" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="385" cy="85" r="3.5" fill="#7dd3fc" filter="url(#glowFraud)"/>
</svg>
