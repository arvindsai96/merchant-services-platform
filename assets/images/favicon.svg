<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pfpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <filter id="pfpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0066FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Shield Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pfpGrad)" />
  
  <!-- Outer Shield Crest -->
  <path d="M32 10 L48 16 C48 30 40 43 32 50 C24 43 16 30 16 16 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Inner Solid Shield -->
  <path d="M32 13 L45 18 C45 29 38 40 32 46 C26 40 19 29 19 18 Z" 
        fill="rgba(255, 255, 255, 0.12)" />

  <!-- Checkmark (Verified Security / Shield-Check) -->
  <path d="M25 29.5 L30 34.5 L39.5 24" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#pfpGlow)" />
</svg>
