<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e29"/>
      <stop offset="50%" stop-color="#062e2d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowHealth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Rich Background -->
  <rect width="400" height="120" fill="url(#bgGradHealth)"/>

  <!-- High-Tech Medical Mesh across entire width -->
  <g stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2">
    <line x1="0" y1="20" x2="400" y2="20" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke-dasharray="4,6"/>
    <line x1="130" y1="0" x2="130" y2="120" stroke-dasharray="4,6"/>
    <line x1="210" y1="0" x2="210" y2="120" stroke-dasharray="4,6"/>
    <line x1="290" y1="0" x2="290" y2="120" stroke-dasharray="4,6"/>
    <line x1="370" y1="0" x2="370" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Dynamic Circuit Beams across entire button -->
  <path d="M0 35 L70 35 L100 65 L220 65 L245 40 L340 40 L360 60 L400 60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glowHealth)"/>
  <path d="M0 90 L110 90 L140 65 L200 65 L230 95 L400 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#glowHealth)"/>

  <!-- EKG Pulse in center-left -->
  <g transform="translate(130, 26)">
    <path d="M0 24 L20 24 L24 8 L30 36 L34 16 L38 28 L42 24 L60 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowHealth)"/>
    <circle cx="60" cy="24" r="3" fill="#34d399" filter="url(#glowHealth)"/>
  </g>

  <!-- Primary Glowing HIPAA Shield & Patient Portal on Right -->
  <g transform="translate(268, 12)">
    <!-- Cyan Halo Glow -->
    <rect x="-6" y="-4" width="122" height="84" rx="14" fill="#00d2ff" opacity="0.22" filter="url(#glowHealth)"/>
    <!-- Portal Display Body -->
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#03201e" stroke="#10b981" stroke-width="2" filter="url(#glowHealth)"/>
    <!-- Medical Cross Badge -->
    <path d="M25 16 L33 16 L33 24 L41 24 L41 32 L33 32 L33 40 L25 40 L25 32 L17 32 L17 24 L25 24 Z" fill="#10b981" filter="url(#glowHealth)"/>
    <!-- Encrypted Token Card -->
    <rect x="46" y="20" width="34" height="24" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="63" cy="30" r="3" fill="#ffffff"/>
    <path d="M57 20 L57 15 C57 11 69 11 69 15 L69 20" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <!-- Status Text -->
    <text x="36" y="60" fill="#38bdf8" font-size="8.5" font-weight="bold" font-family="sans-serif">HIPAA SECURE</text>
    <!-- Arrow indicator -->
    <path d="M88 40 L100 40 M95 35 L100 40 L95 45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="45" cy="80" r="3" fill="#00f2fe" filter="url(#glowHealth)"/>
  <circle cx="105" cy="30" r="2.5" fill="#10b981" opacity="0.8"/>
  <circle cx="215" cy="85" r="3" fill="#38bdf8" filter="url(#glowHealth)"/>
  <circle cx="390" cy="35" r="3" fill="#10b981" filter="url(#glowHealth)"/>
</svg>
