<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradMobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021424"/>
      <stop offset="50%" stop-color="#063244"/>
      <stop offset="100%" stop-color="#0d5963"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glowMobile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradMobile)"/>

  <!-- Full-span Wireless Bluetooth & NFC Radio Wave Arcs -->
  <g transform="translate(200, 60)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.4" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.3" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.2" stroke-dasharray="4,4"/>
  </g>

  <!-- Left: Contactless Smart Card Tapping In -->
  <g transform="translate(120, 30) rotate(-15)">
    <rect x="0" y="0" width="60" height="38" rx="6" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.4" filter="url(#glowMobile)"/>
    <rect x="8" y="8" width="12" height="9" rx="2" fill="#fde047"/>
    <path d="M42 12 A 8 8 0 0 1 42 26" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M47 8 A 14 14 0 0 1 47 30" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Right: Flagship Smartphone with Tap-to-Pay Interface -->
  <g transform="translate(265, 8)">
    <!-- Smartphone Bezel -->
    <rect x="0" y="0" width="60" height="102" rx="12" fill="#020617" stroke="#2dd4bf" stroke-width="2.2" filter="url(#glowMobile)"/>
    <!-- Phone Screen -->
    <rect x="5" y="8" width="50" height="86" rx="8" fill="#0f172a"/>
    <!-- Dynamic Island -->
    <rect x="22" y="3" width="16" height="4" rx="2" fill="#334155"/>
    
    <!-- Tap-To-Pay Glowing NFC Waves on Screen -->
    <g transform="translate(25, 42)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#2dd4bf" stroke-width="2.2" filter="url(#glowMobile)"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#glowMobile)"/>
    </g>
    <!-- Screen Approve Banner -->
    <rect x="10" y="66" width="40" height="18" rx="5" fill="#10b981" filter="url(#glowMobile)"/>
    <text x="14" y="78" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold">APPROVED</text>
  </g>

  <!-- Portable Bluetooth Dongle on Far Right -->
  <g transform="translate(345, 38)">
    <rect x="0" y="0" width="42" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="21" cy="22" r="10" fill="#0369a1"/>
    <path d="M17 22 L20 25 L26 19" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="8" y1="42" x2="34" y2="42" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="40" cy="85" r="2.5" fill="#2dd4bf" filter="url(#glowMobile)"/>
  <circle cx="95" cy="25" r="3" fill="#38bdf8" opacity="0.8"/>
</svg>
