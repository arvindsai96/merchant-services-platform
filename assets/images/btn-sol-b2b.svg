<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradB2B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e29"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowB2B" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Rich Background -->
  <rect width="400" height="120" fill="url(#bgGradB2B)"/>

  <!-- High-Tech ERP Ledger Grid across entire width -->
  <g stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2">
    <line x1="0" y1="20" x2="400" y2="20" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke-dasharray="4,6"/>
    <line x1="130" y1="0" x2="130" y2="120" stroke-dasharray="4,6"/>
    <line x1="210" y1="0" x2="210" y2="120" stroke-dasharray="4,6"/>
    <line x1="290" y1="0" x2="290" y2="120" stroke-dasharray="4,6"/>
    <line x1="370" y1="0" x2="370" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Dynamic Circuit Beams across entire button -->
  <path d="M0 35 L70 35 L100 65 L220 65 L245 40 L340 40 L360 60 L400 60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glowB2B)"/>
  <path d="M0 90 L110 90 L140 65 L200 65 L230 95 L400 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#glowB2B)"/>

  <!-- ACH Bank & Level 3 badge in center-left -->
  <g transform="translate(140, 24)">
    <path d="M10 20 L26 10 L42 20 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="14" y="20" width="3" height="18" fill="#ffffff" opacity="0.9"/>
    <rect x="25" y="20" width="3" height="18" fill="#ffffff" opacity="0.9"/>
    <rect x="35" y="20" width="3" height="18" fill="#ffffff" opacity="0.9"/>
    <rect x="9" y="38" width="34" height="4" fill="#0284c7"/>
    <!-- Level 3 badge -->
    <rect x="11" y="46" width="30" height="11" rx="3" fill="#0369a1"/>
    <text x="26" y="54" fill="#ffffff" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">LVL 2/3</text>
  </g>

  <!-- Primary Glowing Digital Invoice with Instant Bank Pay on Right -->
  <g transform="translate(268, 12)">
    <!-- Cyan Halo Glow -->
    <rect x="-6" y="-4" width="122" height="84" rx="14" fill="#00d2ff" opacity="0.22" filter="url(#glowB2B)"/>
    <!-- Invoice Document Body -->
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#0a192f" stroke="#00f2fe" stroke-width="2" filter="url(#glowB2B)"/>
    <!-- Folded Corner -->
    <path d="M60 0 L72 12 L60 12 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <!-- Invoice lines -->
    <rect x="10" y="10" width="30" height="4" rx="2" fill="#00f2fe"/>
    <rect x="10" y="18" width="45" height="2.5" rx="1" fill="#64748b"/>
    <rect x="10" y="24" width="38" height="2.5" rx="1" fill="#64748b"/>
    <!-- Clickable "PAY INVOICE" Button inside -->
    <rect x="10" y="38" width="55" height="16" rx="4" fill="#0284c7" stroke="#ffffff" stroke-width="0.8" filter="url(#glowB2B)"/>
    <text x="37" y="49" fill="#ffffff" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">PAY INVOICE</text>
    <!-- Verified Badge -->
    <circle cx="70" cy="46" r="6" fill="#10b981" filter="url(#glowB2B)"/>
    <path d="M67 46 L69 48 L73 44" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Arrow indicator -->
    <path d="M88 40 L100 40 M95 35 L100 40 L95 45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="45" cy="80" r="3" fill="#00f2fe" filter="url(#glowB2B)"/>
  <circle cx="105" cy="30" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="215" cy="85" r="3" fill="#10b981" filter="url(#glowB2B)"/>
  <circle cx="390" cy="35" r="3" fill="#00f2fe" filter="url(#glowB2B)"/>
</svg>
