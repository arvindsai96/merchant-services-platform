<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradPOS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e24"/>
      <stop offset="50%" stop-color="#0a2a5e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="posScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glowPOS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradPOS)"/>

  <!-- Full-width Isometric Hardware Grid -->
  <g stroke="rgba(249, 115, 22, 0.22)" stroke-width="1.2">
    <line x1="0" y1="25" x2="400" y2="25" stroke-dasharray="4,6"/>
    <line x1="0" y1="65" x2="400" y2="65" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke-dasharray="4,6"/>
    <line x1="150" y1="0" x2="150" y2="120" stroke-dasharray="4,6"/>
    <line x1="240" y1="0" x2="240" y2="120" stroke-dasharray="4,6"/>
    <line x1="330" y1="0" x2="330" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Handheld mPOS Reader tucked into background -->
  <g transform="translate(205, 30)" opacity="0.45">
    <rect x="0" y="0" width="45" height="62" rx="7" fill="#0f172a" stroke="#f97316" stroke-width="1.2"/>
    <rect x="5" y="6" width="35" height="24" rx="3" fill="#0369a1"/>
    <path d="M15 18 L20 23 L30 13" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="13" cy="42" r="2" fill="#94a3b8"/>
    <circle cx="23" cy="42" r="2" fill="#94a3b8"/>
    <circle cx="33" cy="42" r="2" fill="#10b981"/>
    <circle cx="13" cy="50" r="2" fill="#94a3b8"/>
    <circle cx="23" cy="50" r="2" fill="#94a3b8"/>
    <circle cx="33" cy="50" r="2" fill="#94a3b8"/>
  </g>

  <!-- Primary Countertop Smart POS Register aligned to the far right -->
  <g transform="translate(290, 14)">
    <!-- Terminal Stand Base -->
    <path d="M25 82 L75 82 L68 94 L32 94 Z" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <!-- Terminal Main Body -->
    <rect x="10" y="6" width="80" height="74" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#glowPOS)"/>
    <!-- Screen -->
    <rect x="16" y="13" width="68" height="48" rx="5" fill="url(#posScreen)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Screen Graphics -->
    <circle cx="50" cy="32" r="12" fill="#10b981" filter="url(#glowPOS)"/>
    <path d="M44 32 L48 36 L57 27" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="49" width="44" height="4.5" rx="2" fill="#38bdf8"/>
    <!-- Customer Display / Card slot -->
    <rect x="20" y="66" width="60" height="8" rx="2.5" fill="#1e293b"/>
    <line x1="24" y1="70" x2="76" y2="70" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Thermal Paper Receipt -->
    <path d="M36 6 L36 -6 L64 -6 L64 6 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="40" y1="-2" x2="60" y2="-2" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Side Orange Status Beacon -->
    <rect x="92" y="22" width="3.5" height="38" rx="1.5" fill="url(#orangeGlow)" filter="url(#glowPOS)"/>
  </g>

  <!-- Floating Particles & Hardware Signal Dots -->
  <circle cx="45" cy="80" r="3" fill="#f97316" filter="url(#glowPOS)"/>
  <circle cx="105" cy="30" r="2.5" fill="#38bdf8" opacity="0.75"/>
  <circle cx="215" cy="85" r="3" fill="#10b981" filter="url(#glowPOS)"/>
  <circle cx="375" cy="40" r="3" fill="#fbbf24" filter="url(#glowPOS)"/>
</svg>
