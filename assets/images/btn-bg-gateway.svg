<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021424"/>
      <stop offset="50%" stop-color="#082648"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowApi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradApi)"/>

  <!-- Network Mesh & Branching API Nodes spanning entire width -->
  <g stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.4">
    <line x1="0" y1="60" x2="65" y2="60"/>
    <line x1="65" y1="60" x2="110" y2="30"/>
    <line x1="65" y1="60" x2="110" y2="90"/>
    <line x1="110" y1="30" x2="180" y2="30"/>
    <line x1="110" y1="90" x2="180" y2="90"/>
    <line x1="180" y1="30" x2="245" y2="55"/>
    <line x1="180" y1="90" x2="245" y2="65"/>
  </g>

  <!-- Left/Mid API Nodes & Latency Badges -->
  <circle cx="65" cy="60" r="4.5" fill="#38bdf8" filter="url(#glowApi)"/>
  <circle cx="110" cy="30" r="3.5" fill="#818cf8"/>
  <circle cx="110" cy="90" r="3.5" fill="#34d399"/>

  <g transform="translate(130, 20)">
    <rect x="0" y="0" width="48" height="18" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1"/>
    <text x="6" y="12" fill="#34d399" font-family="monospace" font-size="7.5" font-weight="bold">&lt;JSON/&gt;</text>
  </g>
  <g transform="translate(130, 80)">
    <rect x="0" y="0" width="48" height="18" rx="4" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="1"/>
    <text x="6" y="12" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="bold">v1.REST</text>
  </g>

  <!-- Glowing Code Terminal Console on Right -->
  <g transform="translate(240, 10)">
    <!-- Terminal Window -->
    <rect x="0" y="0" width="148" height="98" rx="10" fill="#030712" stroke="#38bdf8" stroke-width="2" filter="url(#glowApi)"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="148" height="18" rx="10" fill="#0f172a"/>
    <circle cx="10" cy="9" r="3" fill="#ef4444"/>
    <circle cx="20" cy="9" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="9" r="3" fill="#10b981"/>
    <text x="44" y="13" fill="#94a3b8" font-family="monospace" font-size="8">https://api.v1/charge</text>

    <!-- Code Syntax -->
    <text x="10" y="34" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">POST /v1/charges</text>
    <text x="10" y="48" fill="#a7f3d0" font-family="monospace" font-size="8">Status: 200 OK • 12ms</text>
    <text x="10" y="62" fill="#fbcfe8" font-family="monospace" font-size="7.5">{"authorized": true}</text>
    
    <!-- Tokenization pill -->
    <g transform="translate(10, 72)">
      <rect x="0" y="0" width="60" height="16" rx="4" fill="rgba(129, 140, 248, 0.3)" stroke="#818cf8" stroke-width="0.8"/>
      <text x="6" y="11" fill="#c7d2fe" font-family="monospace" font-size="7.5">Token: tok_98a</text>

      <rect x="66" y="0" width="56" height="16" rx="4" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="0.8"/>
      <text x="72" y="11" fill="#6ee7b7" font-family="monospace" font-size="7.5">SLA: 99.999%</text>
    </g>
  </g>

  <!-- Network End Node -->
  <circle cx="240" cy="60" r="5" fill="#38bdf8" filter="url(#glowApi)"/>
</svg>
