<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradRetail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e29"/>
      <stop offset="50%" stop-color="#0a2560"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowRetail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Rich Background -->
  <rect width="400" height="120" fill="url(#bgGradRetail)"/>

  <!-- High-Tech Circuit & Store Grid across entire width -->
  <g stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2">
    <line x1="0" y1="20" x2="400" y2="20" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke-dasharray="4,6"/>
    <line x1="130" y1="0" x2="130" y2="120" stroke-dasharray="4,6"/>
    <line x1="210" y1="0" x2="210" y2="120" stroke-dasharray="4,6"/>
    <line x1="290" y1="0" x2="290" y2="120" stroke-dasharray="4,6"/>
    <line x1="370" y1="0" x2="370" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Dynamic Circuit Beams across entire button -->
  <path d="M0 35 L70 35 L100 65 L220 65 L245 40 L340 40 L360 60 L400 60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glowRetail)"/>
  <path d="M0 90 L110 90 L140 65 L200 65 L230 95 L400 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#glowRetail)"/>

  <!-- Pulse nodes along entire path -->
  <circle cx="70" cy="35" r="3.5" fill="#00f2fe" filter="url(#glowRetail)"/>
  <circle cx="100" cy="65" r="4" fill="#67e8f9" filter="url(#glowRetail)"/>
  <circle cx="220" cy="65" r="3.5" fill="#38bdf8" filter="url(#glowRetail)"/>

  <!-- Mini Laser Barcode Scanner Target in center-left -->
  <g transform="translate(145, 26)">
    <line x1="6" y1="10" x2="6" y2="40" stroke="#38bdf8" stroke-width="2.5" opacity="0.85"/>
    <line x1="12" y1="10" x2="12" y2="40" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="18" y1="10" x2="18" y2="40" stroke="#38bdf8" stroke-width="3" opacity="0.85"/>
    <line x1="24" y1="10" x2="24" y2="40" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    <line x1="30" y1="10" x2="30" y2="40" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <line x1="36" y1="10" x2="36" y2="40" stroke="#38bdf8" stroke-width="3.2" opacity="0.85"/>
    <!-- Red Laser Beam -->
    <line x1="0" y1="25" x2="44" y2="25" stroke="#f43f5e" stroke-width="2" filter="url(#glowRetail)"/>
  </g>

  <!-- Primary Glowing Omnichannel Retail POS Hub on Right -->
  <g transform="translate(268, 12)">
    <!-- Cyan Halo Glow -->
    <rect x="-6" y="-4" width="122" height="84" rx="14" fill="#00d2ff" opacity="0.22" filter="url(#glowRetail)"/>
    <!-- Storefront Glass Register Box -->
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#0b1b38" stroke="#38bdf8" stroke-width="2" filter="url(#glowRetail)"/>
    <!-- Canopy Top Banner -->
    <path d="M0 16 L16 4 L96 4 L112 16 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <!-- Smart Cart Icon inside Display -->
    <g transform="translate(24, 26)">
      <path d="M4 6 L12 6 L18 28 L48 28 L54 12 L16 12" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="33" r="3" fill="#38bdf8"/>
      <circle cx="44" cy="33" r="3" fill="#38bdf8"/>
      <circle cx="58" cy="18" r="5" fill="#10b981" filter="url(#glowRetail)"/>
      <path d="M55 18 L57 20 L61 16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <!-- Arrow indicator -->
    <path d="M88 40 L100 40 M95 35 L100 40 L95 45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="45" cy="75" r="3" fill="#00f2fe" filter="url(#glowRetail)"/>
  <circle cx="105" cy="25" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="225" cy="85" r="2.5" fill="#10b981" filter="url(#glowRetail)"/>
  <circle cx="390" cy="30" r="3" fill="#38bdf8" filter="url(#glowRetail)"/>
</svg>
