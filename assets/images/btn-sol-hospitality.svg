<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradHosp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e29"/>
      <stop offset="50%" stop-color="#0a2560"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowHosp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Rich Background -->
  <rect width="400" height="120" fill="url(#bgGradHosp)"/>

  <!-- High-Tech Circuit & Dining Floor Grid across entire width -->
  <g stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2">
    <line x1="0" y1="20" x2="400" y2="20" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="4,6"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4,6"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke-dasharray="4,6"/>
    <line x1="130" y1="0" x2="130" y2="120" stroke-dasharray="4,6"/>
    <line x1="210" y1="0" x2="210" y2="120" stroke-dasharray="4,6"/>
    <line x1="290" y1="0" x2="290" y2="120" stroke-dasharray="4,6"/>
    <line x1="370" y1="0" x2="370" y2="120" stroke-dasharray="4,6"/>
  </g>

  <!-- Dynamic Circuit Beams across entire button -->
  <path d="M0 35 L70 35 L100 65 L220 65 L245 40 L340 40 L360 60 L400 60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glowHosp)"/>
  <path d="M0 90 L110 90 L140 65 L200 65 L230 95 L400 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#glowHosp)"/>

  <!-- Pulse nodes along path -->
  <circle cx="70" cy="35" r="3.5" fill="#00f2fe" filter="url(#glowHosp)"/>
  <circle cx="100" cy="65" r="4" fill="#67e8f9" filter="url(#glowHosp)"/>
  <circle cx="220" cy="65" r="3.5" fill="#38bdf8" filter="url(#glowHosp)"/>

  <!-- Steam / Hot Dining symbol in center-left -->
  <g transform="translate(145, 26)">
    <path d="M8 20 L10 38 C10 44 28 44 28 38 L30 20 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <path d="M28 22 C35 22 35 34 27 34" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Steam waves -->
    <path d="M14 14 Q17 8 14 4" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 16 Q23 10 20 6" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Primary Glowing Tableside POS Handheld on Right -->
  <g transform="translate(268, 12)">
    <!-- Cyan Halo Glow -->
    <rect x="-6" y="-4" width="122" height="84" rx="14" fill="#00d2ff" opacity="0.22" filter="url(#glowHosp)"/>
    <!-- Terminal Body -->
    <rect x="0" y="0" width="112" height="76" rx="10" fill="#091428" stroke="#38bdf8" stroke-width="2" filter="url(#glowHosp)"/>
    <!-- Screen -->
    <rect x="8" y="8" width="70" height="60" rx="6" fill="#020817" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <!-- Screen Tip Pill Badge -->
    <rect x="16" y="16" width="54" height="18" rx="4" fill="#0284c7"/>
    <text x="43" y="28" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">20% TIP</text>
    <!-- NFC Contactless Waves -->
    <path d="M28 48 Q43 38 58 48" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 54 Q43 40 64 54" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="43" cy="46" r="3" fill="#10b981" filter="url(#glowHosp)"/>
    <!-- Arrow indicator -->
    <path d="M88 40 L100 40 M95 35 L100 40 L95 45" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="45" cy="80" r="3" fill="#00f2fe" filter="url(#glowHosp)"/>
  <circle cx="105" cy="30" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="215" cy="85" r="3" fill="#10b981" filter="url(#glowHosp)"/>
  <circle cx="390" cy="35" r="3" fill="#38bdf8" filter="url(#glowHosp)"/>
</svg>
