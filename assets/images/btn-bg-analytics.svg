<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradAnalytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e24"/>
      <stop offset="50%" stop-color="#0a2560"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="chartBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowAnalytics" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradAnalytics)"/>

  <!-- Analytics Grid lines across entire button -->
  <g stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2">
    <line x1="0" y1="95" x2="400" y2="95"/>
    <line x1="0" y1="65" x2="400" y2="65" stroke-dasharray="3,4"/>
    <line x1="0" y1="35" x2="400" y2="35" stroke-dasharray="3,4"/>
  </g>

  <!-- Left: Mini Donut Chart / KPI Ring -->
  <g transform="translate(190, 34)" opacity="0.45">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#1e3a8a" stroke-width="5"/>
    <circle cx="18" cy="18" r="16" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="50,100" filter="url(#glowAnalytics)"/>
    <circle cx="18" cy="18" r="16" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="25,100" stroke-dashoffset="-50"/>
    <text x="12" y="21" fill="#ffffff" font-family="sans-serif" font-size="6.5" font-weight="bold">ROI</text>
  </g>

  <!-- Right: Prominent 6-Bar Growth Histogram & Trending Ascent Curve -->
  <g transform="translate(255, 15)">
    <!-- Bar 1 -->
    <rect x="8" y="52" width="13" height="28" rx="2.5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <!-- Bar 2 -->
    <rect x="26" y="38" width="13" height="42" rx="2.5" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1"/>
    <!-- Bar 3 -->
    <rect x="44" y="24" width="13" height="56" rx="2.5" fill="url(#chartBarGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Bar 4 (Peak) -->
    <rect x="62" y="10" width="13" height="70" rx="2.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowAnalytics)"/>
    <!-- Bar 5 -->
    <rect x="80" y="30" width="13" height="50" rx="2.5" fill="url(#chartBarGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Bar 6 (Peak All Time Emerald) -->
    <rect x="98" y="4" width="14" height="76" rx="3.5" fill="#10b981" stroke="#34d399" stroke-width="1.8" filter="url(#glowAnalytics)"/>

    <!-- Upward Trend Line / Trajectory -->
    <path d="M14 52 L32 38 L50 24 L68 10 L86 30 L105 4" fill="none" stroke="#facc15" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowAnalytics)"/>
    <circle cx="14" cy="52" r="3" fill="#facc15"/>
    <circle cx="50" cy="24" r="3.5" fill="#facc15"/>
    <circle cx="105" cy="4" r="4.5" fill="#ffffff" stroke="#facc15" stroke-width="2.2" filter="url(#glowAnalytics)"/>

    <!-- Growth Badge (+38.4%) -->
    <g transform="translate(90, -12)">
      <rect x="0" y="0" width="40" height="16" rx="4.5" fill="#065f46" stroke="#34d399" stroke-width="1" filter="url(#glowAnalytics)"/>
      <text x="5" y="11" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold">+38%</text>
    </g>
  </g>

  <!-- Left/Global Telemetry Points -->
  <circle cx="35" cy="50" r="3" fill="#38bdf8" filter="url(#glowAnalytics)"/>
  <circle cx="85" cy="80" r="2.5" fill="#facc15" opacity="0.8"/>
</svg>
