<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a26"/>
      <stop offset="50%" stop-color="#180e3a"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="tealCart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowEcom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradEcom)"/>

  <!-- E-commerce Constellation Network spanning entire canvas -->
  <g stroke="rgba(236, 72, 153, 0.28)" stroke-width="1.2">
    <line x1="20" y1="30" x2="110" y2="70"/>
    <line x1="110" y1="70" x2="180" y2="35"/>
    <line x1="180" y1="35" x2="260" y2="80"/>
    <line x1="260" y1="80" x2="330" y2="40"/>
    <line x1="330" y1="40" x2="385" y2="85"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke-dasharray="3,5" opacity="0.4"/>
  </g>

  <!-- Left: Glowing Shopping Bag & Digital Tag -->
  <g transform="translate(130, 24)">
    <rect x="0" y="14" width="46" height="52" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5" filter="url(#glowEcom)"/>
    <path d="M12 14 C12 2 34 2 34 14" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="40" r="8" fill="url(#purpleGrad)"/>
    <path d="M19 40 L22 43 L27 37" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Right: Complete Checkout Window & 1-Click Pay Modal -->
  <g transform="translate(245, 12)">
    <rect x="0" y="0" width="140" height="92" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2" filter="url(#glowEcom)"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="140" height="18" rx="10" fill="#1e1b4b"/>
    <circle cx="12" cy="9" r="3" fill="#f43f5e"/>
    <circle cx="22" cy="9" r="3" fill="#eab308"/>
    <circle cx="32" cy="9" r="3" fill="#10b981"/>
    <text x="44" y="13" fill="#c084fc" font-family="sans-serif" font-size="7.5" font-weight="bold">checkout.pay/cart</text>

    <!-- Shopping Cart Icon Glowing inside Modal -->
    <g transform="translate(14, 28)">
      <path d="M4 6 L14 6 L20 30 L46 30 L52 14 L18 14" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="35" r="3.5" fill="#ec4899"/>
      <circle cx="44" cy="35" r="3.5" fill="#a855f7"/>
      <circle cx="38" cy="16" r="6" fill="#10b981" filter="url(#glowEcom)"/>
      <path d="M35 16 L37.5 18.5 L41 14" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    </g>

    <!-- 1-Click Pay Fast Button inside Modal -->
    <rect x="74" y="32" width="56" height="24" rx="6" fill="url(#purpleGrad)" stroke="#ffffff" stroke-width="0.8" filter="url(#glowEcom)"/>
    <text x="82" y="47" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">PAY NOW</text>
    
    <!-- Instant Token Badge -->
    <rect x="74" y="62" width="56" height="15" rx="4" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1"/>
    <text x="82" y="73" fill="#67e8f9" font-family="sans-serif" font-size="7">1-Click Fast</text>
  </g>

  <!-- Network Nodes -->
  <circle cx="20" cy="30" r="3" fill="#ec4899" filter="url(#glowEcom)"/>
  <circle cx="110" cy="70" r="3.5" fill="#a855f7"/>
  <circle cx="180" cy="35" r="3" fill="#06b6d4"/>
</svg>
