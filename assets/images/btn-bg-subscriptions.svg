<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradRecur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1f"/>
      <stop offset="50%" stop-color="#043c3f"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowRecur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="url(#bgGradRecur)"/>

  <!-- Recurring Wave Cycles across whole width -->
  <path d="M0 60 Q 50 20, 100 60 T 200 60 T 300 60 T 400 60" fill="none" stroke="rgba(52, 211, 153, 0.35)" stroke-width="2" filter="url(#glowRecur)"/>
  <path d="M0 60 Q 50 100, 100 60 T 200 60 T 300 60 T 400 60" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1.5"/>

  <!-- Left: Automated Dunning Retry Card -->
  <g transform="translate(195, 30)" opacity="0.45">
    <rect x="0" y="0" width="55" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="6" y="14" fill="#a7f3d0" font-family="sans-serif" font-size="7" font-weight="bold">AUTO-DUN</text>
    <rect x="6" y="22" width="43" height="9" rx="2.5" fill="#10b981"/>
    <text x="11" y="29" fill="#ffffff" font-family="sans-serif" font-size="6">RETRY: PASS</text>
  </g>

  <!-- Right: Prominent Sync Cycle Orbits & Clock -->
  <g transform="translate(325, 60)">
    <!-- Orbit Rings -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#34d399" stroke-width="1.8" filter="url(#glowRecur)"/>
    
    <!-- Central Recurring Sync Curved Arrows -->
    <path d="M-18 -9 A 22 22 0 0 1 16 -15" fill="none" stroke="#6ee7b7" stroke-width="2.8" stroke-linecap="round" filter="url(#glowRecur)"/>
    <polygon points="16,-22 25,-15 16,-8" fill="#6ee7b7"/>
    
    <path d="M18 9 A 22 22 0 0 1 -16 15" fill="none" stroke="#6ee7b7" stroke-width="2.8" stroke-linecap="round" filter="url(#glowRecur)"/>
    <polygon points="-16,22 -25,15 -16,8" fill="#6ee7b7"/>

    <!-- Clock Core -->
    <circle cx="0" cy="0" r="13" fill="#022c22" stroke="#34d399" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Active Subscription Badge -->
    <g transform="translate(36, -26)">
      <circle cx="9" cy="9" r="9" fill="#10b981" filter="url(#glowRecur)"/>
      <path d="M5 9 L8 12 L13 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Green Particle Orbs -->
  <circle cx="50" cy="35" r="3" fill="#34d399" filter="url(#glowRecur)"/>
  <circle cx="100" cy="85" r="3" fill="#10b981" filter="url(#glowRecur)"/>
  <circle cx="210" cy="30" r="3.5" fill="#6ee7b7" opacity="0.8"/>
  <circle cx="380" cy="90" r="3" fill="#34d399" opacity="0.8"/>
</svg>
