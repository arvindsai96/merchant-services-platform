<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal Login - PayFlowPro</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.svg">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-light-surface d-flex align-items-center justify-content-center min-vh-100 py-5 position-relative">

  <!-- Top Right Utility Controls (RTL & Theme Toggle) -->
  <div class="auth-top-controls">
    <button class="header-util-btn rtl-toggle-btn shadow-sm" title="Toggle RTL/LTR" type="button">RTL</button>
    <button class="header-util-btn theme-toggle-btn shadow-sm" title="Toggle Light/Dark" type="button">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="custom-card p-4 p-md-5 shadow-lg bg-white">
          <!-- PayFlowPro Brand Logo & Title (Moved down into container) -->
          <div class="text-center mb-4">
            <a class="navbar-brand-logo justify-content-center mb-2 d-inline-flex" href="index.html">
              <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
              <span>PayFlow<span class="text-primary">Pro</span></span>
            </a>
            <p class="text-muted small mb-0">Merchant Business Portal Sign In</p>
          </div>

          <form id="loginForm" class="auth-form" novalidate>
            <div id="authAlert" class="alert d-none mb-3" role="alert" aria-live="polite"></div>
            
            <!-- Email Field -->
            <div class="mb-3">
              <label class="form-label fw-bold small" for="loginEmailInput">Business Email</label>
              <input type="email" id="loginEmailInput" name="email" class="form-control" placeholder="e.g. marcus@northstarretail.com" autocomplete="email" aria-describedby="emailFeedback" aria-invalid="false">
              <div id="emailFeedback" class="form-feedback text-danger small mt-1 d-none" role="alert" aria-live="polite"></div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-bold small mb-0" for="loginPasswordInput">Password</label>
                <a href="forgot-password.html" class="small text-muted">Forgot Password?</a>
              </div>
              <div class="input-group">
                <input type="password" id="loginPasswordInput" name="password" class="form-control border-end-0" placeholder="e.g. Enter your account password" autocomplete="current-password" aria-describedby="passwordFeedback" aria-invalid="false">
                <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="loginPasswordInput" aria-label="Toggle password visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
              <div id="passwordFeedback" class="form-feedback text-danger small mt-1 d-none" role="alert" aria-live="polite"></div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small" for="rememberMe">Remember this browser</label>
            </div>

            <!-- Single Sign-On (SSO) Options -->
            <div class="sso-buttons-wrapper">
              <button type="button" class="btn-sso sso-google-btn" id="ssoGoogleBtn" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
              </button>
              <button type="button" class="btn-sso sso-apple-btn" id="ssoAppleBtn" aria-label="Sign in with Apple">
                <svg viewBox="0 0 384 512" width="17" height="20" fill="currentColor" aria-hidden="true" class="sso-apple-icon">
                  <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                </svg>
                <span>Sign in with Apple</span>
              </button>
            </div>

            <div class="auth-divider">
              <span>or continue with email</span>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-lg w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
              <span>Sign In</span>
              <i class="bi bi-arrow-right"></i>
            </button>

            <div class="text-center text-muted small mb-0">
              Don't have a merchant account? <a href="register.html" class="fw-bold">Sign Up Free</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>
</body>
</html>
